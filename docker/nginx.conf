# Static Astro build. Listens on 8080 as a non-root user.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  location /_astro/ {
    # add_header here replaces the server-level headers, so repeat them.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  }
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Static pages: scripts and fonts from this site only (the build keeps scripts in files, never inline);
  # the session check and Sign out go to the web app on the same address. Inline style attributes stay.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Frame-Options DENY always;
}
